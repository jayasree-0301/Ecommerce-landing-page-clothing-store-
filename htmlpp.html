<!DOCTYPE html>
<html lang="en">
<head>
  <title>Landing page of a Clothing Store</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background-color:white;
      color: #333;
    }

    header {
      background-color: #222;
      padding: 10px;
      text-align: center;
      color: white;
      font-size: 2rem;
      font-weight: bold;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 15px;
      font-weight: 600;
      font-size: 1rem;  
  }

    nav a:hover {
      color: orange;
    }

    .main {
      background: url('https://images.unsplash.com/photo-1521334884684-d80222895322?auto=format&fit=crop&w=1350&q=80')center;

      height: 25rem;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
      font-size: 3rem;
      font-weight: bold;
    }

    .heading {
      max-width: 75rem;
      margin: 2.5rem;
      padding: 1.2rem;
  }

    h2 {
      margin-bottom: 1.2rem;
      text-align: center;
      font-weight: bold;
      font-size: 2rem;
      color: #222;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
      gap: 25px;
    }

    .product-card {
      background-color: white;
      border-radius: 0.5rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      cursor: pointer;
    }

    .product-card:hover {
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    .product-image {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }

    .product-info {
      padding: 15px;
      text-align: center;
    }

    .product-name {
      font-size: 1rem;
      font-weight: semi-bold;
      margin-bottom: 8px;
      color: #222;
    }

    .product-price {
      font-size: 16px;
      color: #ff6f61;
      font-weight: bold;
    }
   
.button-container {
      text-align: center;        
      margin-top: 50px;            
    }
 .btn {
      background-color: black;  
      color: white;                
      padding: 12px 24px;          
      font-size: 18px;             
      font-weight: bold;
      border: none;               
      border-radius: 6px;         
      cursor: pointer;  
      text-decoration:none;             
  }

    footer {
      background-color: #222;
      color: white;
      text-align: center;
      padding: 15px 20px;
      margin-top: 50px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    Mordern Threads
   <nav>
      <a href="#men">Men</a>
      <a href="#women">Women</a>
      <a href="#kids">Kids</a>
      <a href="#sale">Sale</a>
    </nav>
  </header>

  <section class="main">
    Elevate Your Wardrobe!
   </section>

  <div class="heading">
    <h2>Featured Products</h2>
    <div class="products">
      <div class="product-card">
        <img src="https://th.bing.com/th/id/OIP.ZlRaw1mkXPODm_lEJCKgiQHaLH?w=199&h=298&c=7&r=0&o=7&cb=ucfimgc2&dpr=1.5&pid=1.7&rm=3" alt="Men's Jacket" class="product-image" />
        <div class="product-info">
          <div class="product-name">Men's Leather Jacket</div>
          <div class="product-price"><strike>₹2,500.00</strike><br>₹ 2,000.00</div>
        </div>
      </div>

      <div class="product-card">
        <img src="https://img.joomcdn.net/f562ce1012fe99c1e3218fad67d04a56a354d6b3_original.jpeg" alt="Women's hoodie" class="product-image" />
        <div class="product-info">
          <div class="product-name">women's v-neck hoodie</div>
          <div class="product-price"><strike>₹2,000.00</strike><br>₹ 1,680.00</div>
        </div>
      </div>

      <div class="product-card">
        <img src="https://encrypted-tbn1.gstatic.com/images?q=tbn:ANd9GcTTrUUIo1544HaPmlr_HA7nEaxN4emGUs_6E9jOvk4KepOVmlNl" alt="Kids Hoodie" class="product-image" />
        <div class="product-info">
          <div class="product-name">Kids' Cozy Hoodie</div>
          <div class="product-price"><strike>₹2,200.00</strike><br>₹ 1,500.00</div>
        </div>
      </div>

      <div class="product-card">
        <img src="https://i.pinimg.com/originals/0e/1e/44/0e1e44c09f90c9095f6db4b3ac3ec2ea.jpg" alt="women's dress" class="product-image" />
        <div class="product-info">
          <div class="product-name">Midi dress</div>
          <div class="product-price"><strike>₹3,000.00</strike><br>₹ 2,500.00</div>
        </div>
      </div>
    </div>
  </div>
<div class="button-container">
    <a href="products.html" class="btn">Shop Now</a><br><br><br>
 <a href="products.html" class="btn">login</a>
      
  </div>

  <footer>
    &copy; 2025 Mordern Threads. All rights reserved.
  </footer>
</body>
</html>
